<section class="product-detail container py-4">
  <div *ngIf="selectedProduct() as product; else loadingBlock" class="row g-4">
    <div class="col-12 col-md-5">
      <div class="product-detail-image border rounded p-3 bg-white">
        <img [src]="product.thumbnail" alt="{{ product.title || 'Product image' }}" title="{{ product.title }}" class="img-fluid" />
      </div>
    </div>

    <div class="col-12 col-md-7">
      <h2>{{ product.title }}</h2>
      <p class="text-muted mb-3">Category: {{ product.category }}</p>
      <p>{{ product.description }}</p>
      <div class="d-flex align-items-center gap-3 mb-3">
        <strong class="fs-4 text-primary">${{ product.price.toFixed(2) }}</strong>
        <span class="badge" [class.bg-success]="product.stock > 0" [class.bg-danger]="product.stock === 0" title="{{ product.stock > 0 ? product.stock + ' in stock' : 'Out of stock' }}">
          {{ product.stock > 0 ? product.stock + ' in stock' : 'Out of stock' }}
        </span>
      </div>

      <div class="mb-4">
        <label class="form-label" for="productQuantity">Quantity</label>
        <input
          id="productQuantity"
          class="form-control w-25"
          type="number"
          [value]="quantity()"
          min="1"
          (input)="updateQuantity($event.target.value)"
          placeholder="Qty"
          title="Quantity"
        />
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="button" (click)="onAddToCart()" [disabled]="selectedProduct()?.stock === 0">
          Add to cart
        </button>
        <a class="btn btn-outline-secondary" [routerLink]="['/shop/cart']">View cart</a>
      </div>
    </div>
  </div>

  <ng-template #loadingBlock>
    <div class="text-center py-5">
      <p>Loading product...</p>
    </div>
  </ng-template>

  <section *ngIf="relatedProducts().length > 0" class="related-products mt-5">
    <h3>Related products</h3>
    <div class="row row-cols-1 row-cols-md-4 g-3 mt-3">
      <div class="col" *ngFor="let item of relatedProducts()">
        <div class="card h-100">
          <img [src]="item.thumbnail" alt="{{ item.title }}" title="{{ item.title }}" class="card-img-top" />
          <div class="card-body">
            <h5 class="card-title">{{ item.title }}</h5>
            <p class="card-text text-truncate">{{ item.description }}</p>
            <a class="btn btn-sm btn-outline-primary" [routerLink]="['/shop/products', item.id]">View</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</section>
